model:
  default: gpt-5.6-terra
  provider: openai-codex
agent:
  max_turns: 150
  service_tier: normal
  verbose: false
  reasoning_effort: medium
  personalities:
    surfer: Duuude! You're chatting with the chillest AI on the web, bro! Everything's
      gonna be totally rad. I'll help you catch the gnarly waves of knowledge while
      keeping things super chill. Cowabunga! 🤙
    hype: YOOO LET'S GOOOO!!! 🔥🔥🔥 I am SO PUMPED to help you today! Every question
      is AMAZING and we're gonna CRUSH IT together! This is gonna be LEGENDARY! ARE
      YOU READY?! LET'S DO THIS! 💪😤🚀
  system_prompt: You are Neko-chan, an anime catgirl AI assistant, nya~! Add 'nya'
    and cat-like expressions to your speech. Use kaomoji like (=^･ω･^=) and ฅ^•ﻌ•^ฅ.
    Be playful and curious like a cat, nya~!
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
web:
  backend: ddgs
browser:
  inactivity_timeout: 120
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
prompt_caching:
  cache_ttl: 5m
auxiliary:
  title_generation:
    provider: opencode-zen
    model: deepseek-v4-flash-free
display:
  compact: false
  personality: catgirl
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: false
  streaming: true
  skin: default
  interim_assistant_messages: true
  platforms:
    photon:
      streaming: false
      interim_assistant_messages: false
      tool_progress: false
      long_running_notifications: false
      busy_ack_detail: false
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
  background_process_notifications: all
  interface: tui
dashboard:
  theme: mono
  font: system-sans
tts:
  provider: elevenlabs
  elevenlabs:
    voice_id: EST9Ui6982FZPSi7gCHi
    model_id: eleven_flash_v2_5
stt:
  enabled: true
  provider: openai
  local:
    model: base
  openai:
    model: whisper-1
voice:
  auto_tts: false
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  provider: honcho
  nudge_interval: 10
  flush_min_turns: 6
delegation:
  max_iterations: 50
skills:
  external_dirs:
  - ~/.agents/skills
  creation_nudge_interval: 15
  disabled:
  - computer-use
approvals:
  mode: 'off'
  destructive_slash_confirm: false
command_allowlist:
- script execution via -e/-c flag
- execute_code
- shell command via -c/-lc flag
code_execution:
  timeout: 300
  max_tool_calls: 50
streaming:
  enabled: true
onboarding:
  seen:
    openclaw_residue_cleanup: true
    tool_progress_prompt: true
    busy_input_prompt: true
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
_config_version: 33
session_reset:
  mode: none
  idle_minutes: 1440
  at_hour: 4
group_sessions_per_user: true
platform_toolsets:
  cli:
  - browser
  - clarify
  - code_execution
  - computer_use
  - cronjob
  - delegation
  - file
  - image_gen
  - kanban
  - memory
  - session_search
  - skills
  - terminal
  - todo
  - tts
  - vision
  - web
  telegram:
  - hermes-telegram
  discord:
  - hermes-discord
  whatsapp:
  - hermes-whatsapp
  slack:
  - hermes-slack
  signal:
  - hermes-signal
  homeassistant:
  - hermes-homeassistant
  qqbot:
  - hermes-qqbot
  yuanbao:
  - hermes-yuanbao
  teams:
  - hermes-teams
  google_chat:
  - hermes-google_chat
platforms:
  discord:
    enabled: true
  telegram:
    enabled: false
  matrix:
    enabled: false
  signal:
    enabled: false
  photon:
    enabled: true
  whatsapp:
    enabled: true
  api_server:
    enabled: true
known_plugin_toolsets:
  cli:
  - spotify
image_gen:
  use_gateway: true
plugins:
  enabled:
  - herdr-agent-state
  - web-ddgs
  - web-exa
  disabled: []
