# A small, keyboard-first tmux setup with mouse-friendly tabs and a restrained
# Catppuccin Frappe status bar. Plugin-specific settings live beside the plugin.

# Terminal and session behavior
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB"
set -g focus-events on
set -g set-clipboard on
set -g detach-on-destroy off

# Windows and panes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename on
set -g automatic-rename-format '#{pane_current_command}'

# Mouse support and scrollback
set -g mouse on
set -g history-limit 100000
setw -g mode-keys vi

# Keep new tabs and splits in the current working directory.
bind c new-window -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'

# Vim-style pane navigation and resizing after the prefix.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Use Alt+arrow to move between tabs without the prefix.
bind -n M-Left previous-window
bind -n M-Right next-window

# Copy mode: enter with prefix-[, navigate with Vim keys, and copy with y/Enter.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

# Reload the config without restarting tmux.
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Status bar: session, activity, and clock. Tab formats come after TPM because
# the Catppuccin plugin supplies defaults while it loads.
set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-style 'bg=colour235,fg=colour245'
set -g status-left-length 30
set -g status-left '#{prefix_highlight}#[fg=colour39,bold] #S #[default]'
set -g status-right-length 80
set -g status-right '#(git -C "#{pane_current_path}" branch --show-current 2>/dev/null | sed "s/^/ /")#(upower -i /org/freedesktop/UPower/devices/DisplayDevice 2>/dev/null | grep -q "state:" && upower -i /org/freedesktop/UPower/devices/DisplayDevice 2>/dev/null | rg -o "[0-9]+%" | head -1 | sed "s/^/  ⚡ /")#[fg=colour245]  %a %H:%M#[default]'
set -g window-status-separator ' '
setw -g monitor-activity on
set -g visual-activity off

# Plugins managed by TPM. Press prefix + I to install or update declarations.
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'sainnhe/tmux-fzf'
# tmux-fzf: prefix + f opens a compact command/session/window/pane picker.
set-environment -g TMUX_FZF_LAUNCH_KEY 'f'
set-environment -g TMUX_FZF_ORDER 'command|keybinding|session|window|pane'
set-environment -g TMUX_FZF_OPTIONS '-p -w 70% -h 60% -m'

# Catppuccin Frappe, with plain (non-rounded) tabs.
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-git-branch 'on'

set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'frappe'
set -g @catppuccin_window_status_style 'basic'
set -g @catppuccin_window_left_separator ' '
set -g @catppuccin_window_middle_separator ' '
set -g @catppuccin_window_right_separator ' '
set -g @catppuccin_window_current_left_separator ' '
set -g @catppuccin_window_current_middle_separator ' '
set -g @catppuccin_window_current_right_separator ' '
run '~/.tmux/plugins/tpm/tpm'

# Theme-aware overrides: show the active pane's executable, not its terminal title.
set -g window-status-format '#[fg=colour245]#I:#{pane_current_command}#{?window_activity_flag,*,}#[default]'
set -g window-status-current-format '#[bg=colour39,fg=colour235,bold] #I:#{pane_current_command} #[default]'
